name: Deploy Production (dev host)

# ilovelawyer-admin production on the shared host.
#
# This one was already SSM-based, so the change is small and deliberate:
#   - INSTANCE_ID moves from i-09ee0651b89dbdca5 to the shared host.
#   - Container `ilovelawyer-prod-admin` on 4035. The dev admin already holds
#     4032 on this host; reusing it would stop dev rather than fail.
#   - Joins the forhu-dev network, as every other container there does.
#   - The role becomes forhu-deploy, which is the only one permitted to send SSM
#     commands to this instance.
#   - The smoke test hits the container on the host rather than
#     admin.ilovelawyer.com. Until DNS is cut over that hostname still answers
#     from the OLD box, so the old test would pass while this deploy was broken.
#
# Unchanged: lint, typecheck, the image_tag input for redeploying an existing
# build, and .env.production written before `docker build` because NEXT_PUBLIC_*
# is inlined at build time. Note the filename — Next.js loads .env.production for
# a production build and ignores .env.staging, which is what the app repo uses.
# The two differ on purpose; do not "align" them.
#
# The container holds no secrets, only NEXT_PUBLIC_API_URL and PORT, so nothing
# travels through Parameter Store.
#
# Dispatch only while the old workflow still deploys on push to main.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to deploy"
        required: false
      image_tag:
        description: "Existing image tag to deploy. Leave blank to build from ref."
        required: false
        default: ""

concurrency:
  group: ilovelawyer-prod-admin-dev-host
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ACCOUNT_ID: "617163942417"
  INSTANCE_ID: i-0f95a93145ea25e7a
  ECR_REPOSITORY: ilovelawyer-admin
  CONTAINER: ilovelawyer-prod-admin
  NETWORK: forhu-dev
  HOST_PORT: "4035"
  APP_PORT: "3000"
  NODE_ENV: production

jobs:
  deploy:
    name: Lint, build, push and deploy (ilovelawyer production admin)
    runs-on: ubuntu-24.04-arm
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN || 'arn:aws:iam::617163942417:role/forhu-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          [ -z "$TAG" ] && TAG="$(git rev-parse HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "registry=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "Deploying ${{ env.ECR_REPOSITORY }}:$TAG"

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ steps.tag.outputs.registry }}"

      # Must exist before docker build — NEXT_PUBLIC_* is inlined by `next build`,
      # not read at runtime. .env.production, not .env.staging.
      - name: Write env file
        if: ${{ github.event.inputs.image_tag == '' }}
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          cat > "${{ github.workspace }}/.env.production" << EOF
          NODE_ENV=${{ env.NODE_ENV }}
          NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          EOF

          grep -q '^NEXT_PUBLIC_API_URL=.' .env.production || {
            echo "::error::NEXT_PUBLIC_API_URL is empty — the bundle would ship with no API to call."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: ${{ github.event.inputs.image_tag == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.tag.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}

      - name: Deploy via SSM
        id: send
        env:
          REGISTRY: ${{ steps.tag.outputs.registry }}
          TAG: ${{ steps.tag.outputs.tag }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${{ env.ECR_REPOSITORY }}:${TAG}"

          COMMANDS=(
            "set -euo pipefail"
            "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${REGISTRY}"
            "docker pull --platform linux/arm64 ${IMAGE}"
            "docker rm -f ${{ env.CONTAINER }} 2>/dev/null || true"
            "docker run -d --name ${{ env.CONTAINER }} --restart unless-stopped --platform linux/arm64 --network ${{ env.NETWORK }} -p 127.0.0.1:${{ env.HOST_PORT }}:${{ env.APP_PORT }} -e NODE_ENV=${{ env.NODE_ENV }} -e PORT=${{ env.APP_PORT }} -e NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} ${IMAGE}"
            "docker image prune -f"
          )

          # jq builds the JSON, so a quote inside any command cannot break it.
          PARAMS=$(printf '%s\n' "${COMMANDS[@]}" | jq -R . | jq -sc '{commands: .}')

          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ env.CONTAINER }} ${TAG}" \
            --timeout-seconds 900 \
            --parameters "${PARAMS}" \
            --query Command.CommandId --output text)

          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command: $CMD_ID"

      - name: Wait for the deploy
        run: |
          set -uo pipefail
          STATUS=Pending
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "${{ steps.send.outputs.command_id }}" \
              --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "${{ steps.send.outputs.command_id }}" \
            --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::deploy $STATUS"; exit 1; }

      # On the host, not admin.ilovelawyer.com — that still answers from the old
      # box until DNS moves, so testing it would pass regardless of this deploy.
      - name: Smoke test (host port)
        run: |
          set -uo pipefail
          CMD_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "smoke ${{ env.CONTAINER }}" \
            --parameters commands='["for i in $(seq 1 12); do CODE=$(curl -sL -o /dev/null -m 10 -w %{http_code} http://127.0.0.1:'"${{ env.HOST_PORT }}"'/ || echo 000); echo attempt $i: $CODE; [ \"$CODE\" = \"200\" ] && exit 0; sleep 5; done; exit 1"]' \
            --query Command.CommandId --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation --region "${{ env.AWS_REGION }}" \
              --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --region "${{ env.AWS_REGION }}" \
            --command-id "$CMD_ID" --instance-id "${{ env.INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          [ "$STATUS" = "Success" ] || { echo "::error::admin did not answer on ${{ env.HOST_PORT }}"; exit 1; }
